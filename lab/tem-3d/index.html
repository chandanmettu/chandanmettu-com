<style>
/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}

/* TEM Anatomy 3D, in the Lab's textbook family (Reynolds, Sénarmont, Durgapur): Source Serif 4 and Caveat, warm glass
   cards, a capsule, a predict / flap / challenge loop. The room is dim (TEM rooms are kept dark to see the screen), so
   the glass is a little more opaque. Colour carries meaning: --e electrons, --p the screen's light, --b a lens field,
   --h heat; the rust accent is the family's kicker colour. */
@font-face { font-family: "Source Serif 4"; font-style: normal; font-weight: 200 900; font-display: swap; src: url("./fonts/source-serif-4-latin-wght-normal.woff2") format("woff2-variations"); }
@font-face { font-family: "Source Serif 4"; font-style: italic; font-weight: 200 900; font-display: swap; src: url("./fonts/source-serif-4-latin-wght-italic.woff2") format("woff2-variations"); }
@font-face { font-family: "Caveat"; font-style: normal; font-weight: 400 700; font-display: swap; src: url("./fonts/caveat-latin-wght-normal.woff2") format("woff2-variations"); }

:root {
  --ink: #1c2433; --ink2: rgba(28, 36, 51, 0.66); --accent: #9a3b2a; --paper: #fbf8f0;
  --e: #2a66d9; --e-glow: #5aa2ff; --p: #1d8f45; --p-glow: #4fd862; --b: #6a3fd0; --b-glow: #9b74ff; --h: #c4520c; --h-glow: #ff9a3c;
  --serif: "Source Serif 4", Georgia, serif; --hand: "Caveat", cursive;
  --glass: rgba(251, 248, 240, 0.84); --glass-edge: rgba(255, 255, 255, 0.7);
  --shadow: 0 14px 40px rgba(5, 8, 14, 0.45), 0 2px 6px rgba(5, 8, 14, 0.25);
  /* the kit's own variables, kept away from this page */
  --mute: rgba(28, 36, 51, 0.6); --line: rgba(28, 36, 51, 0.12); --faint: rgba(28, 36, 51, 0.2); --panel: var(--glass);
}
html, body { margin: 0; height: 100%; overflow: hidden; background: #13161c; overscroll-behavior: none; }
#app { position: fixed; inset: 0; color: var(--ink); font-family: var(--serif); font-variant-ligatures: normal; -webkit-font-smoothing: antialiased; }
#app * { box-sizing: border-box; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
#gl.drag { cursor: grabbing; }
#ui { position: absolute; inset: 0; pointer-events: none; }
.glass { pointer-events: auto; background: var(--glass); -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2); box-shadow: var(--shadow), inset 0 1px 0 var(--glass-edge), inset 0 0 0 1px rgba(255, 255, 255, 0.35); }
:where(#ui) button { font: inherit; color: inherit; }
#ui button:focus-visible, #ui input:focus-visible, #ui a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.t-e { color: var(--e); } .t-p { color: var(--p); } .t-b { color: var(--b); } .t-h { color: var(--h); } .t-ink { color: var(--ink); }

/* chapters */
#chapters { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; padding: 4px; border-radius: 20px; max-width: calc(100vw - 24px); overflow-x: auto; scrollbar-width: none; z-index: 3; }
#chapters::-webkit-scrollbar { display: none; }
#chapters button { border: 0; background: transparent; border-radius: 16px; padding: 7px 11px; cursor: pointer; font: 600 12.5px/1 var(--serif); white-space: nowrap; color: var(--ink2); display: flex; align-items: center; gap: 6px; }
#chapters button:hover { background: rgba(28, 36, 51, 0.07); color: var(--ink); }
#chapters button[aria-current="true"] { background: var(--ink); color: var(--paper); }
#chapters .n { font: 600 10px/1 var(--serif); opacity: .6; }
#chapters .st { width: 7px; height: 7px; border-radius: 50%; border: 1px solid currentColor; opacity: .45; }
#chapters button:first-child .st { display: none; }
#chapters .st.got { background: var(--e-glow); border-color: var(--e-glow); opacity: 1; box-shadow: 0 0 7px var(--e-glow); }

/* the cards */
.card { position: absolute; top: 64px; width: 330px; border-radius: 20px; padding: 6px 16px 14px; max-height: calc(100vh - 150px); overflow: auto; scrollbar-width: thin; }
#card { left: 16px; }
#panel { right: 16px; width: 300px; }
.card .grip { display: flex; justify-content: space-between; align-items: center; width: 100%; border: 0; background: none; padding: 8px 0 4px; cursor: pointer; font: 600 11px/1 var(--serif); letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
.card .grip .chev { transition: transform .25s; letter-spacing: 0; }
.card.closed .grip .chev { transform: rotate(-90deg); }
.card.closed .body { display: none; }
.body h1 { font: 640 25px/1.08 var(--serif); margin: 4px 0 8px; letter-spacing: -0.01em; }
.body h2 { font: 640 12.5px/1.2 var(--serif); margin: 14px 0 6px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.body p { font: 400 14.2px/1.45 var(--serif); margin: 0 0 9px; }
.body .lede { font-style: italic; color: var(--ink2); }
.body .try b { color: var(--accent); font-weight: 650; }
.body .small, .body .src { font-size: 11.5px; line-height: 1.4; color: var(--ink2); }
.body .src { margin-top: 10px; }
.body .src a { color: inherit; }
.predict { display: grid; gap: 6px; margin: 6px 0 10px; }
.predict button { text-align: left; border: 1px solid rgba(28, 36, 51, 0.18); border-radius: 12px; padding: 8px 10px; background: rgba(255, 255, 255, 0.5); cursor: pointer; font: 400 13.5px/1.3 var(--serif); }
.predict button:hover { background: rgba(255, 255, 255, 0.85); }
.predict button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.predict button.right { box-shadow: inset 0 0 0 2px var(--e-glow); }
.flap { margin: 8px 0 6px; border-radius: 12px; background: #f4ecdc; box-shadow: 0 2px 0 rgba(28, 36, 51, 0.12), inset 0 0 0 1px rgba(28, 36, 51, 0.12); overflow: hidden; }
.flap > button { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; border: 0; background: repeating-linear-gradient(-45deg, #f4ecdc 0 6px, #efe4cf 6px 7px); cursor: pointer; font: 600 13px/1.2 var(--serif); letter-spacing: .04em; }
.flap > button span:last-child { font: 600 19px/1 var(--hand); color: var(--accent); }
.flap .under { display: none; padding: 10px 12px 4px; }
.flap .under p { font-size: 13.5px; }
.flap.open .under { display: block; }
.flap.open > button { background: #efe4cf; }
.verdict { font: 600 17px/1.2 var(--hand) !important; color: var(--accent); }
.verdict.ok { color: var(--e); }
.challenge { margin: 10px 0 4px; padding: 10px 12px; border-radius: 12px; border: 1.5px dashed rgba(154, 59, 42, 0.5); }
.challenge h3 { margin: 0 0 4px; font: 600 12px/1.2 var(--serif); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.challenge p { font-size: 13.5px; margin: 0; }
.challenge.done { border-style: solid; border-color: var(--e-glow); background: rgba(90, 162, 255, 0.1); }
.challenge .stamp { float: right; margin: -2px -4px 4px 8px; width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--accent); color: var(--accent); display: grid; place-items: center; text-align: center; font: 700 8.4px/1.05 var(--serif); letter-spacing: .02em; text-transform: uppercase; transform: rotate(-12deg); opacity: .22; padding: 5px; overflow-wrap: anywhere; }
.challenge.done .stamp { opacity: 1; border-color: var(--e); color: var(--e); animation: stamp .4s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes stamp { from { transform: rotate(-12deg) scale(1.8); opacity: 0; } }
.more { margin-top: 8px; }
.more summary { cursor: pointer; font: 600 11px/1.2 var(--serif); letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); list-style: none; }
.more summary::before { content: '+ '; }
.more[open] summary::before { content: '− '; }
.more p { font-size: 13.2px; margin-top: 8px; }

/* readings */
.big { display: flex; align-items: baseline; gap: 10px; margin: 4px 0 2px; flex-wrap: wrap; }
.big b { font: 600 46px/1 var(--hand); letter-spacing: .01em; font-variant-numeric: tabular-nums; }
.big b small { font: 600 26px/1 var(--hand); }
.big span { font: italic 400 14.5px/1.2 var(--serif); color: var(--ink2); }
.scope { margin: 10px 0 6px; padding: 0; background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; text-align: center; }
.scope canvas { display: block; width: 210px; height: 210px; margin: 0 auto; border-radius: 50%; background: #000; box-shadow: 0 0 0 6px #23272e, 0 0 0 7px #4a4f58, 0 8px 22px rgba(0, 0, 0, 0.35), 0 0 28px rgba(79, 216, 98, 0.18); }
.scope figcaption { display: grid; gap: 1px; margin-top: 10px; font: 400 12.5px/1.3 var(--serif); color: var(--ink2); }
.scope figcaption b { font-weight: 640; color: var(--p); }
.slider { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 10px 0 0; font-size: 14px; }
.slider output { font: 600 13px/1.3 var(--serif); font-variant-numeric: tabular-nums; }
.slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--ink); margin: 4px 0 0; cursor: pointer; }
.slider[hidden] { display: none; }
.ctl { margin-top: 10px; }
.rl { display: block; font: 600 10.5px/1 var(--serif); letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); margin-bottom: 5px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.seg button { border: 1px solid rgba(28, 36, 51, 0.16); border-radius: 11px; padding: 7px 4px; background: rgba(255, 255, 255, 0.45); cursor: pointer; font: 600 12.5px/1.1 var(--serif); white-space: nowrap; }
.seg button:hover { background: rgba(255, 255, 255, 0.85); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.actions button { border: 0; border-radius: 16px; padding: 8px 12px; background: rgba(28, 36, 51, 0.08); cursor: pointer; font: 600 13px/1 var(--serif); }
.actions button:hover { background: rgba(28, 36, 51, 0.14); }
.actions button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
ul.facts { list-style: none; padding: 0; margin: 12px 0 4px; display: grid; gap: 6px; }
ul.facts li { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; align-items: baseline; font-size: 13px; line-height: 1.35; padding-bottom: 6px; border-bottom: 1px solid rgba(28, 36, 51, 0.08); }
ul.facts li b { font: 600 22px/1 var(--hand); color: var(--ink); white-space: nowrap; text-align: right; }
ul.facts li small { grid-column: 1 / -1; font-size: 11px; color: var(--ink2); font-style: italic; }
.bars { margin-top: 6px; }
.bars[hidden] { display: none; }
.bar { display: grid; grid-template-columns: 56px 1fr 64px; align-items: center; gap: 8px; font-size: 13px; margin: 5px 0; }
.bar .bk i { font-style: italic; color: var(--ink2); font-size: 11.5px; }
.bar .bt { height: 7px; border-radius: 4px; background: rgba(28, 36, 51, 0.08); overflow: hidden; }
.bar .bt span { display: block; height: 100%; border-radius: 4px; background: rgba(29, 143, 69, 0.45); transition: width .6s cubic-bezier(.16, 1, .3, 1); }
.bar.on .bt span { background: var(--p); box-shadow: 0 0 8px var(--p-glow); }
.bar b { font: 600 19px/1 var(--hand); text-align: right; }
.bar.unseen b { color: rgba(28, 36, 51, 0.3); }
.bar.on .bk { font-weight: 700; }

/* the capsule */
.capsule { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(18px, env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-radius: 26px; width: min(740px, calc(100vw - 700px)); min-width: 460px; z-index: 3; }
.capsule .ic { width: 36px; height: 36px; border: 0; border-radius: 18px; background: transparent; cursor: pointer; font-size: 18px; line-height: 1; display: grid; place-items: center; flex: none; color: var(--ink); text-decoration: none; }
.capsule .ic:hover { background: rgba(28, 36, 51, 0.07); }
.capsule .ic[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.capsule .capline { flex: 1; min-width: 0; padding: 0 8px; font: 400 14.2px/1.3 var(--serif); }
.capsule .pill { flex: none; border: 0; border-radius: 18px; padding: 9px 15px; background: var(--ink); color: var(--paper); font: 600 13.5px/1 var(--serif); cursor: pointer; white-space: nowrap; }
.capsule .pill.on { background: rgba(28, 36, 51, 0.1); color: var(--ink); }
.capsule .sep { width: 1px; height: 22px; background: rgba(28, 36, 51, 0.15); margin: 0 4px; flex: none; }
#credit { position: absolute; right: 16px; bottom: 10px; margin: 0; font: italic 400 11.5px/1.3 var(--serif); color: rgba(240, 236, 226, 0.55); pointer-events: auto; }
#credit a { color: inherit; }
.toast { position: absolute; left: 50%; top: 70px; transform: translate(-50%, -8px); padding: 8px 16px; border-radius: 18px; background: var(--ink); color: var(--paper); font: 600 20px/1.1 var(--hand); opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; box-shadow: 0 0 22px rgba(90, 162, 255, 0.45); z-index: 4; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* callouts pinned to the parts */
.leaders { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.leaders path { fill: none; stroke: rgba(246, 241, 230, 0.75); stroke-width: 1.1; }
.leaders circle { fill: #fbf8f0; stroke: var(--ink); stroke-width: 1.3; }
.leaders .t-e circle { fill: var(--e-glow); } .leaders .t-p circle { fill: var(--p-glow); } .leaders .t-b circle { fill: var(--b-glow); } .leaders .t-h circle { fill: var(--h-glow); }
.calls { position: absolute; inset: 0; }
.call { position: absolute; left: 0; top: 0; text-align: left; border: 0; padding: 4px 9px 5px; border-radius: 10px; background: rgba(251, 248, 240, 0.92); box-shadow: 0 2px 8px rgba(5, 8, 14, 0.35), inset 0 0 0 1px rgba(28, 36, 51, 0.12); white-space: nowrap; cursor: default; will-change: transform; pointer-events: auto; }
.call[data-link] { cursor: pointer; }
.call b { display: block; font: 640 13px/1.15 var(--serif); color: var(--ink); }
.call span { display: block; font: italic 400 11.5px/1.2 var(--serif); color: var(--ink2); }
.call span:empty { display: none; }
.call.t-e b { color: var(--e); } .call.t-p b { color: var(--p); } .call.t-b b { color: var(--b); } .call.t-h b { color: var(--h); }
.cursor { position: absolute; left: 0; top: 0; z-index: 50; margin: -2px 0 0 -2px; filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.5)); transform-origin: 2px 2px; display: none; }
.ring { position: absolute; left: -18px; top: -18px; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--e-glow); opacity: 0; z-index: 49; pointer-events: none; }
.sheet { display: none; }

@media (max-width: 1240px) and (min-width: 900px) {
  .card { width: 290px; }
  #panel { width: 270px; }
  /* the cards stop 86 px above the bottom, so the capsule can run the full width under them */
  .capsule { width: min(740px, calc(100vw - 32px)); min-width: 0; }
  .capsule .sep, .capsule [data-full], #credit { display: none; }
}
@media (max-height: 820px) and (min-width: 900px) {
  .body h1 { font-size: 22px; }
  .big b { font-size: 40px; }
  .scope canvas { width: 170px; height: 170px; }
}

/* ---------------------------------------------------------------- phone */
html.phone .card, html.phone #credit { display: none; }
html.phone #chapters { top: 10px; left: 10px; right: 10px; transform: none; max-width: none; }
html.phone .scope { position: absolute; right: 10px; top: 62px; width: 112px; margin: 0; padding: 7px 7px 6px; border-radius: 16px; background: var(--glass); box-shadow: var(--shadow); z-index: 2; }
html.phone .scope canvas { width: 98px; height: 98px; box-shadow: 0 0 0 3px #23272e, 0 0 16px rgba(79, 216, 98, 0.2); }
html.phone .scope figcaption { margin-top: 6px; font-size: 9.5px; line-height: 1.2; }
html.phone .sheet { display: block; position: absolute; left: 0; right: 0; bottom: 0; max-height: 46%; overflow: auto; border-radius: 20px 20px 0 0; padding: 0 14px calc(10px + env(safe-area-inset-bottom)); z-index: 2; }
html.phone .sheet.folded .pane { display: none; }
html.phone .tabs { position: sticky; top: 0; z-index: 2; display: flex; gap: 4px; padding: 10px 0 6px; background: linear-gradient(rgba(251, 248, 240, 0.97) 80%, rgba(251, 248, 240, 0)); }
html.phone .tabs button { flex: 1; border: 0; background: rgba(28, 36, 51, 0.07); border-radius: 12px; padding: 8px 0; font: 600 13px/1 var(--serif); cursor: pointer; }
html.phone .tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
html.phone .tabs .grip2 { flex: 0 0 40px; }
html.phone .sheet.folded .grip2 { transform: rotate(180deg); }
html.phone .pane[hidden] { display: none; }
html.phone .body h1 { font-size: 21px; }
html.phone .capsule { left: 8px; right: 8px; transform: none; width: auto; min-width: 0; bottom: auto; padding: 4px 6px; z-index: 3; }
html.phone .capsule .sep, html.phone .capsule [data-still], html.phone .capsule [data-full] { display: none; }
html.phone .capsule .capline { font-size: 12px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
html.phone .capsule .pill { padding: 8px 11px; font-size: 12.5px; }
html.phone .toast { top: 60px; font-size: 17px; }
html.phone .call b { font-size: 11.5px; }
html.phone .call span { font-size: 10px; }

</style>
